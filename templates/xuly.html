<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển Ảnh sang PDF - ToolHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">  <!-- CSS LAYOUT DÙNG CHUNG -->
  <link rel="stylesheet" href="../static/css/layout/layout.css">
  
  <!-- CSS RIÊNG CỦA TRANG XỬ LÝ -->
  <link rel="stylesheet" href="../static/css/pages/xuly.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container">
      <a href="#" class="logo">
        <div class="logo-icon"><i class="fas fa-cubes"></i></div>
        <div class="logo-text">ToolHub</div>
      </a>
      <div class="header-actions">
        <a href="#" class="btn btn-login">Đăng nhập</a>
        <a href="#" class="btn btn-register">Đăng ký</a>
      </div>
    </div>
  </header>

  <!-- MAIN LAYOUT (SÁT LỀ PHẢI) -->
  <div class="main-layout">

      <!-- LEFT: KHU VỰC FILE -->
      <div class="file-area">
        <div class="file-area-content">
          <div class="file-card-wrap" id="fileCardWrap">
            <!-- Card file (render động, mặc định có 1 file mẫu) -->
            <div class="file-card" id="fileCard">
              <button type="button" class="btn-remove-file" onclick="removeFile()" title="Xóa file">
                <i class="fas fa-times"></i>
              </button>
              <div class="file-preview" id="filePreview">
                <div class="paper-mockup">
                  <div class="line title"></div>
                  <div class="line"></div>
                  <div class="line short"></div>
                  <div class="line"></div>
                  <div class="line block"></div>
                  <div class="line"></div>
                  <div class="line short"></div>
                </div>
              </div>
              <div class="file-name" id="fileName">4758f49c82ec4c9ab6759056a...</div>
            </div>
          </div>

          <!-- Nút thêm file -->
          <button type="button" class="btn-add-more" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-plus-circle"></i> Thêm file
            <span class="badge" id="fileCountBadge">1</span>
          </button>

          <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFileSelect(event)">
        </div>
      </div>

      <!-- RIGHT: BẢNG TÙY CHỌN -->
      <aside class="options-area">
        <div class="options-header">
          <i class="fas fa-sliders-h"></i> Tùy chọn chuyển đổi
        </div>

        <div class="options-body">
          <!-- Page Orientation -->
          <div class="form-group">
            <label class="form-label">Hướng trang</label>
            <div class="opt-grid">
              <button type="button" class="opt-btn active" onclick="setOrientation(this)">
                <i class="far fa-file-alt"></i>
                <span>Dọc</span>
              </button>
              <button type="button" class="opt-btn" onclick="setOrientation(this)">
                <i class="far fa-file-alt" style="transform: rotate(90deg);"></i>
                <span>Ngang</span>
              </button>
            </div>
          </div>

          <!-- Page Size -->
          <div class="form-group">
            <label class="form-label">Khổ giấy</label>
            <select class="form-select">
              <option>A4 (297 × 210 mm)</option>
              <option>A3 (420 × 297 mm)</option>
              <option>A5 (210 × 148 mm)</option>
              <option>Letter (216 × 279 mm)</option>
            </select>
          </div>

          <!-- Margin -->
          <div class="form-group">
            <label class="form-label">Lề trang</label>
            <div class="opt-grid">
              <button type="button" class="opt-btn active" onclick="setMargin(this)">
                <i class="far fa-image"></i>
                <span>Không lề</span>
              </button>
              <button type="button" class="opt-btn" onclick="setMargin(this)">
                <i class="fas fa-border-all"></i>
                <span>Nhỏ</span>
              </button>
              <button type="button" class="opt-btn" onclick="setMargin(this)">
                <i class="fas fa-border-style"></i>
                <span>Lớn</span>
              </button>
            </div>
          </div>

          <!-- Merge Checkbox -->
          <div class="form-group">
            <label class="checkbox-row">
              <input type="checkbox" checked id="mergeCheck">
              Gộp tất cả ảnh vào một file PDF
            </label>
          </div>
        </div>

        <!-- Nút Convert -->
        <div class="action-area">
          <button type="button" class="btn-convert" onclick="startConvert()" id="btnConvert">
            Chuyển sang PDF <i class="fas fa-arrow-circle-right"></i>
          </button>
        </div>
      </aside>

  </div>

  <script>
    /* =========================================================
       TOGGLE ACTIVE CHO CÁC NÚT TÙY CHỌN
       ========================================================= */
    function setOrientation(btn) {
      const btns = btn.parentElement.querySelectorAll('.opt-btn');
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function setMargin(btn) {
      const btns = btn.parentElement.querySelectorAll('.opt-btn');
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    /* =========================================================
       XỬ LÝ CHỌN FILE (CẬP NHẬT PREVIEW VÀ BADGE)
       ========================================================= */
    let selectedFiles = [];

    function handleFileSelect(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      // Lấy file đầu tiên để hiển thị preview (giữ logic đơn giản như ảnh mẫu)
      const firstFile = files[0];
      
      // Cập nhật tên file
      document.getElementById('fileName').textContent = firstFile.name;
      
      // Cập nhật badge đếm số file
      const badge = document.getElementById('fileCountBadge');
      const currentCount = parseInt(badge.textContent) || 1;
      badge.textContent = currentCount + files.length - 1; // +thêm file mới

      // Nếu là ảnh thì hiển thị preview
      if (firstFile.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('filePreview').innerHTML = 
            `<img src="${e.target.result}" style="width: 100%; height: 100%; object-fit: contain;">`;
        };
        reader.readAsDataURL(firstFile);
      }
    }

    /* =========================================================
       XÓA FILE (RESET VỀ TRẠNG THÁI BAN ĐẦU)
       ========================================================= */
    function removeFile() {
      document.getElementById('fileInput').value = '';
      document.getElementById('fileName').textContent = '4758f49c82ec4c9ab6759056a...';
      document.getElementById('fileCountBadge').textContent = '1';
      
      // Trả lại khung giấy giả lập
      document.getElementById('filePreview').innerHTML = `
        <div class="paper-mockup">
          <div class="line title"></div>
          <div class="line"></div>
          <div class="line short"></div>
          <div class="line"></div>
          <div class="line block"></div>
          <div class="line"></div>
          <div class="line short"></div>
        </div>
      `;
    }

    /* =========================================================
       XỬ LÝ CHUYỂN ĐỔI (GIẢ LẬP)
       ========================================================= */
    function startConvert() {
      const btn = document.getElementById('btnConvert');
      const originalHtml = btn.innerHTML;
      
      // Vô hiệu hóa nút và hiển thị loading
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';

      // Giả lập thời gian xử lý
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
        alert('Tạo file PDF thành công!\n(Đây là giao diện mô phỏng xử lý)');
      }, 1500);
    }

    // Hiển thị tên file được chọn từ trang chon-file.html (nếu có)
    (function initFileFromSession() {
      const saved = sessionStorage.getItem('toolhub_selected_file_name');
      if (saved) {
        document.getElementById('fileName').textContent = saved;
      }
    })();
  </script>

</body>
</html>

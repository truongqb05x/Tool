<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuyển Ảnh sang PDF - ToolHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">  <!-- CSS LAYOUT DÙNG CHUNG -->
  <link rel="stylesheet" href="../static/css/layout/layout.css">
  
  <!-- CSS RIÊNG CỦA TRANG XỬ LÝ -->
  <link rel="stylesheet" href="../static/css/pages/xuly.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo" style="text-decoration:none;">
        <div class="logo-icon"><i class="fas fa-cubes"></i></div>
        <div class="logo-text">ToolHub</div>
      </a>

      <div class="header-search-wrap">
        <div class="header-search">
          <input type="text" id="searchInput" placeholder="Tìm công cụ: nén PDF, ghép ảnh, chuyển đổi..."
                 autocomplete="off" aria-autocomplete="list" aria-controls="searchSuggestions">
          <button type="button" id="searchSubmitBtn"><i class="fas fa-search"></i></button>
        </div>
        <div class="search-suggestions" id="searchSuggestions"></div>
      </div>

      <div class="header-actions" id="headerActions">
        <div id="guestActions" style="display:flex; gap:8px;">
          <a href="index.html" class="btn btn-login" onclick="if(typeof openModal==='function'){openModal('login'); return false;}">Đăng nhập</a>
          <a href="index.html" class="btn btn-register" onclick="if(typeof openModal==='function'){openModal('register'); return false;}">Đăng ký</a>
        </div>

        <div id="userActions" class="user-menu" style="display:none;">
          <div class="user-menu-trigger" id="userMenuTrigger">
            <div class="user-avatar" id="headerAvatar">U</div>
            <span class="user-name" id="headerUserName">Người dùng</span>
            <i class="fas fa-chevron-down"></i>
          </div>
          <div class="user-dropdown" id="userDropdown">
            <div class="user-dropdown-header">
              <strong id="dropdownName">Người dùng</strong>
              <small id="dropdownEmail">user@example.com</small>
            </div>
            <a href="index.html" class="user-dropdown-item">
              <i class="fas fa-history"></i> Lịch sử xử lý
            </a>
            <a href="index.html" class="user-dropdown-item">
              <i class="fas fa-cog"></i> Cài đặt tài khoản
            </a>
            <div class="user-dropdown-divider"></div>
            <a href="#" class="user-dropdown-item danger" onclick="logout(); return false;">
              <i class="fas fa-sign-out-alt"></i> Đăng xuất
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN LAYOUT (SÁT LỀ PHẢI) -->
  <div class="main-layout">

      <!-- LEFT: KHU VỰC FILE -->
      <div class="file-area">
        <div class="file-area-content">
          <div class="file-card-wrap" id="fileCardWrap">
            <!-- Card file (render động, mặc định có 1 file mẫu) -->
            <div class="file-card" id="fileCard">
              <button type="button" class="btn-remove-file" onclick="removeFile()" title="Xóa file">
                <i class="fas fa-times"></i>
              </button>
              <div class="file-preview" id="filePreview">
                <div class="paper-mockup">
                  <div class="line title"></div>
                  <div class="line"></div>
                  <div class="line short"></div>
                  <div class="line"></div>
                  <div class="line block"></div>
                  <div class="line"></div>
                  <div class="line short"></div>
                </div>
              </div>
              <div class="file-name" id="fileName">4758f49c82ec4c9ab6759056a...</div>
            </div>
          </div>

          <!-- Nút thêm file -->
          <button type="button" class="btn-add-more" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-plus-circle"></i> Thêm file
            <span class="badge" id="fileCountBadge">1</span>
          </button>

          <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFileSelect(event)">
        </div>
      </div>

      <!-- RIGHT: BẢNG TÙY CHỌN -->
      <aside class="options-area">
        <div class="options-header">
          <i class="fas fa-sliders-h"></i> Tùy chọn chuyển đổi
        </div>

        <div class="options-body">
          <!-- Page Orientation -->
          <div class="form-group">
            <label class="form-label">Hướng trang</label>
            <div class="opt-grid">
              <button type="button" class="opt-btn active" onclick="setOrientation(this)">
                <i class="far fa-file-alt"></i>
                <span>Dọc</span>
              </button>
              <button type="button" class="opt-btn" onclick="setOrientation(this)">
                <i class="far fa-file-alt" style="transform: rotate(90deg);"></i>
                <span>Ngang</span>
              </button>
            </div>
          </div>

          <!-- Page Size -->
          <div class="form-group">
            <label class="form-label">Khổ giấy</label>
            <select class="form-select">
              <option>A4 (297 × 210 mm)</option>
              <option>A3 (420 × 297 mm)</option>
              <option>A5 (210 × 148 mm)</option>
              <option>Letter (216 × 279 mm)</option>
            </select>
          </div>

          <!-- Margin -->
          <div class="form-group">
            <label class="form-label">Lề trang</label>
            <div class="opt-grid">
              <button type="button" class="opt-btn active" onclick="setMargin(this)">
                <i class="far fa-image"></i>
                <span>Không lề</span>
              </button>
              <button type="button" class="opt-btn" onclick="setMargin(this)">
                <i class="fas fa-border-all"></i>
                <span>Nhỏ</span>
              </button>
              <button type="button" class="opt-btn" onclick="setMargin(this)">
                <i class="fas fa-border-style"></i>
                <span>Lớn</span>
              </button>
            </div>
          </div>

          <!-- Merge Checkbox -->
          <div class="form-group">
            <label class="checkbox-row">
              <input type="checkbox" checked id="mergeCheck">
              Gộp tất cả ảnh vào một file PDF
            </label>
          </div>
        </div>

        <!-- Nút Convert -->
        <div class="action-area">
          <button type="button" class="btn-convert" onclick="startConvert()" id="btnConvert">
            Chuyển sang PDF <i class="fas fa-arrow-circle-right"></i>
          </button>
        </div>
      </aside>

  </div>

  <!-- ===== JAVASCRIPT CHÍNH ===== -->
  <script src="../static/js/app.js"></script>
  <script src="../static/js/pages/xuly.js"></script>

</body>
</html>
